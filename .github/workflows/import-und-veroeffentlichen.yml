# Holt jede Nacht die Förderdaten, speichert sie im Repository und veröffentlicht die Handy-Version auf GitHub Pages.
# Einmalig nötig: Settings -> Pages -> Source: "GitHub Actions".
name: Daten importieren und veröffentlichen

on:
  schedule:
    - cron: "30 2 * * *"      # täglich 02:30 UTC (= 04:30 deutscher Sommerzeit)
  workflow_dispatch:           # Knopf "Run workflow" im Reiter Actions
  push:
    branches: [main]
    paths-ignore: ["data/programme.json", "data/import.log.json"]

permissions:
  contents: write              # Importergebnis ins Repository schreiben
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Förderdaten importieren
        # Fällt eine Quelle aus, bleiben ihre Einträge vom letzten erfolgreichen Lauf erhalten.
        continue-on-error: true
        env:
          FN_KONTAKT: https://github.com/${{ github.repository }}
          FN_KOMPAKT: "1"
        run: python -m importer.run

      - name: Importergebnis speichern
        run: |
          git config user.name "fordernavi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/programme.json data/import.log.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Keine Änderungen."; else git commit -m "Datenimport $(date -u +%Y-%m-%d)"; git push; fi

      - name: Handy-Version bauen
        run: python build.py --site --kontakt "${{ vars.MELDE_EMAIL }}"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

